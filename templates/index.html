<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вариант 17 — Обмен полос</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 Вариант 17: Обмен чередующихся полос</h1>
            <p class="subtitle">Изменение изображения путём перестановки чётных и нечётных полос</p>
        </header>

        <main>
            <section class="card">
                <h2>📥 Загрузите изображение</h2>
                <form method="post" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="direction">Направление перестановки:</label>
                        <select name="direction" id="direction" required>
                            <option value="horizontal">↔️ Горизонтально</option>
                            <option value="vertical">↕️ Вертикально</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="strip_width">Ширина полосы (пиксели):</label>
                        <input type="number" name="strip_width" id="strip_width" value="20" min="1" max="200" required>
                    </div>

                    <div class="form-group">
                        <label for="file">Изображение (JPG/PNG):</label>
                        <input type="file" name="file" id="file" accept="image/*" required>
                    </div>

                    <div class="form-group captcha-block">
                        <label>CAPTCHA: введите символы с картинки</label>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <img id="captcha_img" src="/captcha/{{ captcha_uid }}.png" alt="captcha">
                            <button type="button" onclick="reloadCaptcha()" class="btn small">↻</button>
                        </div>
                        <input type="hidden" name="captcha_uid" value="{{ captcha_uid }}">
                        <input type="text" name="captcha" required placeholder="Введите код">
                    </div>

                    <div class="form-group">
                        <label for="classify">
                            <input type="checkbox" name="classify" id="classify"> Выполнить классификацию (NN)
                        </label>
                    </div>
                    <div class="g-recaptcha" data-sitekey="6Le95iUsAAAAAK-2qlmqVh96NBmCTLc6TilZhx8y"></div>
                    <button type="submit" class="btn animate-pulse">
                        🔄 Обработать изображение
                    </button>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
