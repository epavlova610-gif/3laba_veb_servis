<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Лабораторная 3 — Вариант 17</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <h1>Вариант 17: Обмен чередующихся полос</h1>
    <form method="post" enctype="multipart/form-data">
        <p>
            <label>Направление: 
                <select name="direction">
                    <option value="horizontal">Горизонтально</option>
                    <option value="vertical">Вертикально</option>
                </select>
            </label>
        </p>
        <p>
            <label>Ширина полосы (пиксели): 
                <input type="number" name="strip_width" value="20" min="1" required>
            </label>
        </p>
        <p>
            <label>Изображение: 
                <input type="file" name="file" accept="image/*" required>
            </label>
        </p>
        <button type="submit">Обработать</button>
    </form>
</body>
</html>
